name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests (compile + webview typecheck + node:test, both drivers)
      - run: npm test
      # Integration tests inside a real VS Code (needs a display server)
      - run: xvfb-run -a npm run test:integration
      # The .vsix must always be buildable
      - run: npx @vscode/vsce package -o /tmp/build-check.vsix
